<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1 class="page-titles">Welcome to NUST Profile</h1>

    <!-- Form that student have to fill in -->
   
    <form id="regForm" class="form-stud" novalidate>

        <div class="row-form">
        <label for="firstName">First Name: <span aria-hidden="true">*</span></label>
        <input type="text" id="firstName" name="firstName" required/>
        <small class="error" id="err-first"></small><br>
    </div>
        
    <div class="row-form">
        <label for="lastName">Last Name: <span aria-hidden="true">*</span></label>
        <input type="text" id="lastName" name="lastName" required/>
        <small class="error" id="err-last"></small><br>
    </div>

    <div class="row-form">
        <label for="email">Email: <span aria-hidden="true">*</span></label>
        <input type="email" id="email" name="email" required/>
        <small class="error" id="err-email"></small><br>
    </div>    

    <div class="row-form">
        <label for="prg">Programme: </label>
        <textarea id="prg" name="prg"></textarea>
    </div>
        
    <div class="row-form">
        <fieldset>
        <legend>Year of Study: <span aria-hidden="true">*</span></legend>
        <label><input type="radio" name="year" value="1" required/> 1</label>
        <label><input type="radio" name="year" value="2"/> 2</label>
        <label><input type="radio" name="year" value="3"/> 3</label>
        </fieldset>
    </div>    

    <div class="row-form">
        <label for="interests">Interests: </label>
        <textarea id="interests" name="interests"></textarea><br>
    </div>    

    <div class="row-form">
        <label for="photo">Photo URL: </label>
        <input type="url" id="photo" name="photo" required/>
    </div>

        <div aria-live="polite" class="sr" id="live"></div>
        <button type="submit">Add Student</button>
        </form>


        <!-- Information from the students will be shown here -->

        <!-- Addition, style option -->
        <h2>Search Students</h2>
<input type="text" id="searchInput" placeholder="Search by name, email, or programme" />

        <h2 class="card-title">Profile Cards</h2>
          <div id="profileCardsContainer" class="container-card"></div>

        <h2 class="table-title">Student Information</h2>
           
    <table id="summaryTable" class="table-info" border="5">
        <thead>
            <tr>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Programme</th>
                <th>Year</th>
                <th>Interests</th>
                <th>Photo URL</th>
                <th>Add/Remove</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
        
        
        <script src="script.js"></script> 
</body>
</html>
